<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>A day with the attention model — on the real dashboard</title>
  <link rel="stylesheet" href="/deck.css">
  <script type="module" src="/deck.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>A day with the attention model</h1>
      <p>The real dashboard in the phone, the real gateway behind it, a scripted day on the clock. Play it, or jump anywhere on the timeline. Touch the phone at any time — the story pauses and adapts to what you changed.</p>
    </header>
    <div class="minibar" id="minibar" hidden>
      <span class="digital" id="mini-time">00:00</span>
      <span class="mode-line" id="mini-mode"></span>
      <span class="spacer"></span>
      <button class="btn primary" data-act="toggle-play" id="mini-play">▶</button>
    </div>
    <div class="grid">
      <div class="phone">
        <!-- The phone's own chrome: the clock and the notification bell. What
             reaches it is what a device with the push opt-in's default setting
             would show — the gateway's pushes through that device's filter,
             collapsed by tag as the service worker does. -->
        <div class="statusbar">
          <span class="sb-time" id="sb-time">00:00</span>
          <button class="bell" data-act="shade" id="bell" aria-label="Notifications" aria-expanded="false" title="Notifications on this phone">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
            <span class="badge" id="bell-badge" hidden>0</span>
          </button>
        </div>
        <div class="screen-wrap">
          <iframe id="phone" class="screen" src="/" title="The dashboard"></iframe>
          <div class="headsup" id="headsup" hidden></div>
          <div class="shade" id="shade" data-act="shade-close" hidden></div>
        </div>
      </div>
      <div id="deck"></div>
    </div>
  </div>
</body>
</html>
