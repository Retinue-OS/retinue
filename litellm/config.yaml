model_list:
  - model_name: retinue-claude
    litellm_params:
      model: os.environ/LITELLM_PRIMARY_MODEL
  # Catch-all for direct Claude model IDs: agent files may pin `model: sonnet`
  # or `model: opus`, which Claude Code resolves to concrete IDs such as
  # claude-sonnet-5 before sending. The dashboard's connection test also
  # sends concrete IDs.
  - model_name: claude-*
    litellm_params:
      model: anthropic/claude-*
  - model_name: retinue-openrouter
    litellm_params:
      model: os.environ/LITELLM_FALLBACK_MODEL
  # Dashboard picker entries. The web gateway builds the conversation-model
  # picker from GET /model/info, offering every route whose model_info sets
  # `retinue_picker: true`, labeled by `retinue_label`. These three seed the
  # picker with the Claude defaults; models added at runtime through the
  # LiteLLM admin UI join it the same way — set the same two model_info keys.
  # Routes without the flag (the plumbing above) never reach the picker.
  # Set the flags on CONCRETE routes only, never on a wildcard route:
  # /model/info expands a wildcard into one entry per known matching model,
  # each copy carrying the same model_info — so a flagged wildcard floods the
  # picker with identically-labeled entries.
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
    model_info:
      retinue_picker: true
      retinue_label: Opus (deepest reasoning)
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
    model_info:
      retinue_picker: true
      retinue_label: Sonnet (balanced)
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
    model_info:
      retinue_picker: true
      retinue_label: Haiku (fastest)

general_settings:
  # master_key is read from general_settings (proxy_server.load_config). Under
  # litellm_settings the same line would only setattr() the (resolved) value
  # onto the litellm module, where nothing reads it — auth then works only
  # because the env var itself is set. Keep it here; this is also the value
  # _get_salt_key() falls back to for store_model_in_db.
  master_key: os.environ/LITELLM_MASTER_KEY
  # Claude Code keeps its subscription OAuth token in the Authorization
  # header, so the proxy key is passed in this custom header instead
  # (sent via ANTHROPIC_CUSTOM_HEADERS).
  litellm_key_header_name: x-litellm-api-key
  # Persist models added at runtime (admin UI / POST /model/new) to the DB and
  # load them on start. Without this, runtime-added models are lost on restart
  # and the "add a pickable model in the admin UI" workflow doesn't work.
  store_model_in_db: true

litellm_settings:
  num_retries: 0
  # Fallbacks are resolved by the model_group the caller ASKED for. An agent
  # file may pin any concrete model ID — including one released after this
  # file was last edited — and Claude Code sends it verbatim, so the set of
  # model groups arriving here is open-ended and cannot be enumerated. A
  # per-model `fallbacks` list therefore silently leaves every model it does
  # not name without a fallback (LiteLLM reports "No fallback model group
  # found for original model_group=…" and gives up), and the wildcard route
  # above does not stand in: `claude-*` is a deployment pattern, not a
  # fallback key, and LiteLLM does not expand it during fallback lookup.
  # `default_fallbacks` applies to every model group instead, including ones
  # that do not exist yet — the only form that survives a new model release.
  # (It nominally applies to retinue-openrouter too; a fallback from that
  # group to itself is a no-op retry, not a loop.)
  default_fallbacks:
    - retinue-openrouter
  model_group_settings:
    # Only Anthropic-backed routes may receive Claude Code's forwarded client
    # headers (`x-*` and `anthropic-beta`) — the OpenRouter route must not, or
    # the proxy key in x-litellm-api-key travels to a third party. That rules
    # out the global general_settings boolean, which forwards for everything.
    #
    # Entries here match the DEPLOYMENT rather than the name the caller
    # requested, and the documented wildcard shape is a provider prefix
    # (`anthropic/*`). One such entry covers every Claude model this proxy can
    # serve, current and future, so no individual model ever needs naming.
    # LITELLM_FALLBACK_MODEL resolves to `openrouter/…` and is not matched.
    forward_client_headers_to_llm_api:
      - anthropic/*
