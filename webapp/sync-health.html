<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <title>Retinue — Update health data</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">

  <!-- The target of "update your health data" links in threads, served at
       /sync-health (docs/dashboard.md, "Inside the Android shell"). Static:
       a GET never changes server state. The phone shell reads Health Connect
       and POSTs the changes itself; the page's script
       (components/sync-health-page.js) only asks it to, when the address
       carries #sync. Four cases: in the shell with #sync (start
       the sync, then go back), in the shell without (explain, offer the
       button), an Android browser (the Ara app is needed — an intent link
       opens this page in it), anywhere else (explain only). -->
  <script type="module" src="/components/nav.js"></script>
  <script type="module" src="/components/shelf.js"></script>
</head>
<body>
  <main class="settings">
    <retinue-nav></retinue-nav>
    <header class="top">
      <h1>Health data</h1>
    </header>

    <section class="scard">
      <h2>Update from the phone</h2>
      <p class="hint" data-explain>Health data from the phone's Health Connect
        (watch, ring, blood-pressure app) reaches your health records through
        the Ara app on Android, which sends it whenever it comes to the front.
        This page asks it for an update now.</p>
      <p class="health-sync-line" data-line aria-live="polite"></p>
      <p class="health-sync-actions" data-actions hidden>
        <button type="button" class="setting-btn" data-now hidden>Update now</button>
        <a class="setting-btn" data-open-app hidden>Open in Ara app</a>
        <button type="button" class="setting-btn" data-back hidden>Back</button>
      </p>
    </section>
    <retinue-shelf></retinue-shelf>
  </main>

  <script type="module" src="/components/sync-health-page.js"></script>
  <script src="/sw-register.js"></script>
</body>
</html>
