<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <title>Retinue — Contacts</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">

  <!-- The address book (docs/contacts.md): every person, whatever channel
       reaches them, their attention settings and the VIP flag. Reached from the
       dock at the foot of the home, not the navigation row. -->
  <script type="module" src="/components/contacts.js"></script>
  <script type="module" src="/components/nav.js"></script>
</head>
<body>
  <main>
    <retinue-nav current="contacts"></retinue-nav>
    <retinue-contacts></retinue-contacts>
  </main>

  <script>
    // Register the service worker so this page is available offline too.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
