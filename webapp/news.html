<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <title>Retinue — News</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">

  <!-- The same news component the dashboard card uses, in `full` mode: every
       item with its excerpt, the feed/read/hidden filters, read-aloud for the
       whole feed, and the profile the Herald has learned (readable and
       editable). Every headline links out to the source — nothing is mirrored
       here. -->
  <script type="module" src="/components/news.js"></script>
</head>
<body>
  <main>
    <retinue-news full heading="News"></retinue-news>
  </main>

  <script>
    // Register the service worker so this page is available offline too.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
