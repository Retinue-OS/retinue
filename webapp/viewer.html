<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <title>Retinue — File</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* The file fills the frame under the navigation row; the frame is locked
       to the visible height, as on the chat page, so a PDF scrolls inside
       its own viewer while the row stays in reach. */
    main:has(retinue-viewer-page) {
      height: 100vh;
      height: 100dvh;
      height: var(--frame-h, 100dvh);
      min-height: 0;
      overflow: hidden;
    }
    retinue-viewer-page { flex: 1; min-height: 0; }
  </style>

  <!-- One thread attachment (?src=…&name=…&type=…), shown inside the
       dashboard instead of the browser's bare viewer, which in an installed
       PWA has no way back (components/viewer-page.js). -->
  <script type="module" src="/components/viewer-page.js"></script>
  <!-- The navigation row, with the back button at its start; the page
       decides where back goes (it listens for retinue-back). -->
  <script type="module" src="/components/nav.js"></script>
  <script type="module" src="/viewport.js"></script>
  <!-- The minimized pages: threads, chats and projects parked one tap away
       (issue #282). Every page carries it as the last child of <main>. -->
  <script type="module" src="/components/shelf.js"></script>
</head>
<body>
  <main>
    <retinue-nav back></retinue-nav>
    <retinue-viewer-page></retinue-viewer-page>
    <retinue-shelf></retinue-shelf>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
