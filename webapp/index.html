<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d12">
  <title>Retinue</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">

  <!-- Web components. Each is a standalone custom element that fetches its
       own data document. Edit this file to add, remove or reorder cards. -->
  <!-- The navigation row every top-level page opens with: the home and the
       chats, threads, projects and news pages beside it, plus settings. -->
  <script type="module" src="/components/nav.js"></script>
  <!-- The home: one list of what wants attention — threads, chats and projects
       alike, each with its importance, urgency and delivery — over the
       gateway's GET /attention (docs/attention-model.md). -->
  <script type="module" src="/components/attention.js"></script>
  <!-- The thread viewer: threads with Ara open in place, answering the
       #conversation-<id> hash that rows and push notifications use, and the
       composer (#new) for a new conversation. Invisible until then. -->
  <script type="module" src="/components/conversations.js"></script>
  <script type="module" src="/components/app-launcher.js"></script>
  <!-- No opt-in element here (that UI lives on /settings.html now), but the
       module keeps an already-granted subscription healthy on every load. -->
  <script type="module" src="/components/push.js"></script>
  <!-- Splitter manager for the wide layout: drag-resizable regions, persisted
       per device. A no-op on phones, where the splitters are hidden. -->
  <script type="module" src="/layout.js"></script>
  <!-- Keeps an open thread's locked frame the height that is actually
       visible on the phone (styles.css reads --frame-h). -->
  <script type="module" src="/viewport.js"></script>
  <!-- Applies a freshly activated shell version by reloading once (guarded
       against open drafts), and re-checks for one whenever the window becomes
       visible — so an always-open dashboard doesn't stay stale for a day. -->
  <script type="module" src="/components/update.js"></script>
  <!-- Non-functional/static mock cards are intentionally disabled until they
       are backed by real data flows.
  <script type="module" src="/components/agenda.js"></script>
  <script type="module" src="/components/messages.js"></script>
  <script type="module" src="/components/todo.js"></script>
  <script type="module" src="/components/briefing.js"></script>
  -->
</head>
<body>
  <main>
    <!-- The way across: the same row as on every other page, with Home as
         the place you are. Where the chats, threads, projects and news pages
         used to be linked from — the foot of the list, and each of them led
         back from its own tail. -->
    <retinue-nav current="home"></retinue-nav>

    <!-- No page header here: the home's first line is the attention list's
         own, where the focus mode is the title (components/attention.js).
         The state the user is in is the one thing worth the space above a
         list of what wants their attention — and a greeting was not it. -->

    <!-- The deck: the region above the dock. On phones the wrappers are
         display:contents (everything stacks, the page scrolls); in the wide
         layout the column is a fixed frame whose regions scroll internally.
         No news here: the home is for what wants attention, and a feed is a
         distraction — the news has its own page in the navigation row. -->
    <div class="deck">
      <section class="col col-main">
        <!-- The home: what wants attention now, next, held for the digest, and
             waiting on others — threads, chats and projects as one list. Each
             row opens where it lives (a thread here, a chat or project on its
             page); ⓘ opens the item's details with its corrections. -->
        <retinue-attention heading="Attention"></retinue-attention>

        <!-- The thread viewer (the same element the conversations page uses):
             invisible until a thread or the composer is opened by hash, then
             it takes the whole display (see styles.css) so the chat with Ara
             is immersive. Its list is never shown here — the attention list
             above is the list. -->
        <retinue-conversations viewer heading="Conversations"></retinue-conversations>
      </section>
    </div>
    <!-- Non-functional/static mock cards are intentionally disabled until they
         are backed by real data flows.
    <retinue-agenda   heading="Today"                 src="/data/agenda.json"></retinue-agenda>
    <retinue-messages heading="Important messages"   src="/data/messages.json"></retinue-messages>
    <retinue-todo     heading="Top to-do"            src="/data/todo.json"></retinue-todo>
    <retinue-briefing heading="Briefing"             src="/data/briefing.json"></retinue-briefing>
    -->

    <!-- App quick-launch dock. Configure the buttons by hand here. Each child is
         a normal link: tel: / sms: / mailto: / geo: work in every browser;
         intent:// works in Chromium browsers and can launch arbitrary installed
         apps (these local OS actions work offline). Plain paths like /sends
         navigate within the PWA; the dashboard's own pages are in the
         navigation row at the top, so the dock does not repeat them. -->
    <retinue-app-launcher>
      <a href="tel:"><span class="ico">&#128222;</span><span class="lbl">Phone</span></a>
      <a href="sms:"><span class="ico">&#128172;</span><span class="lbl">SMS</span></a>
      <a href="mailto:"><span class="ico">&#9993;&#65039;</span><span class="lbl">Mail</span></a>
      <a href="geo:0,0?q="><span class="ico">&#128506;&#65039;</span><span class="lbl">Map</span></a>
      <a href="/sends"><span class="ico">&#128228;</span><span class="lbl">Sends</span></a>
    </retinue-app-launcher>
  </main>

  <script>
    // Register the service worker so the shell (and the last data) stay
    // available offline -- the dialer button keeps working without signal.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
